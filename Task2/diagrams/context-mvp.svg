<tspan x="1160" dy="17.55">пациентов и расписаний</tspan>
</text>
<rect x="45" y="750" width="1580" height="62" rx="8" fill="#fff7e7" stroke="#d7b571" />
<text x="59" y="774" font-family="Arial, sans-serif" font-size="14" fill="#172d43" text-anchor="start"><tspan x="59" dy="0">Платформа включает порталы, приложение, IAM, хранение и аудит. Учётный контур 1С и существующий файловый сервер находятся за её границей.</tspan></text>
<rect x="45" y="825" width="1580" height="62" rx="8" fill="#fff7e7" stroke="#d7b571" />
<text x="59" y="849" font-family="Arial, sans-serif" font-size="14" fill="#172d43" text-anchor="start"><tspan x="59" dy="0">Доступ пациентов к общему диску закрыт. Ресепшен напоминает за сутки; клинические результаты, онлайн-эквайринг, мобильное приложение и партнёрский API вводятся на следующем этапе.</tspan></text>
</svg>