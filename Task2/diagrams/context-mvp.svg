<text x="1450.0" y="595.9" font-family="Arial, sans-serif" font-size="16" fill="#172d43" text-anchor="middle">
<tspan x="1450.0" dy="0">1С / файловый контур</tspan>
<tspan x="1450.0" dy="21.6">[External Software System]</tspan>
