<tspan x="210.0" dy="21.6">[Person]</tspan>
<tspan x="210.0" dy="21.6">Расписание и напоминания</tspan>
</text>
<rect x="640" y="350" width="390" height="200" rx="12" fill="#e8f0fb" stroke="#2361a6" stroke-width="2" />
<text x="835.0" y="422.6" font-family="Arial, sans-serif" font-size="16" fill="#172d43" text-anchor="middle">
