<tspan x="480" dy="17.55">HTTPS</tspan>
</text>
<rect x="399.3" y="543.5" width="161.4" height="43.0" fill="white" rx="3" />
<text x="480" y="560.2" font-family="Arial, sans-serif" font-size="13" fill="#172d43" text-anchor="middle">
<tspan x="480" dy="0">Расписание / сведения</tspan>
<tspan x="480" dy="17.55">для напоминания, HTTPS</tspan>
</text>
<rect x="1075.95" y="308.5" width="168.1" height="43.0" fill="white" rx="3" />
<text x="1160" y="325.2" font-family="Arial, sans-serif" font-size="13" fill="#172d43" text-anchor="middle">
