<tspan x="40" dy="0">C4 · C2 — контейнеры MVP</tspan>
</text>
<text x="40" y="88" font-family="Arial, sans-serif" font-size="14" fill="#172d43" text-anchor="start"><tspan x="40" dy="0">Контейнеры — приложения и хранилища. Registry, Scheduling, Clinical, Billing, Documents и Consent реализуются модулями одного Java-приложения.</tspan></text>
