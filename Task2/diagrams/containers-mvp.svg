<tspan x="740" dy="0">Задания / outbox</tspan>
<tspan x="740" dy="17.55">без прямых PII в очереди</tspan>
</text>
<rect x="1864.35" y="742.25" width="141.3" height="25.5" fill="white" rx="3" />
<text x="1935" y="759.0" font-family="Arial, sans-serif" font-size="13" fill="#172d43" text-anchor="middle">
<tspan x="1935" dy="0">Индекс событий, TLS</tspan>
</text>
<rect x="2052.75" y="913.5" width="114.5" height="43.0" fill="white" rx="3" />
<text x="2110" y="930.2" font-family="Arial, sans-serif" font-size="13" fill="#172d43" text-anchor="middle">
<tspan x="2110" dy="0">Архив событий</tspan>
<tspan x="2110" dy="17.55">TLS / retention</tspan>
</text>
<rect x="40" y="1235" width="2110" height="65" rx="8" fill="#fff7e7" stroke="#d7b571" />
<text x="54" y="1259" font-family="Arial, sans-serif" font-size="14" fill="#172d43" text-anchor="start"><tspan x="54" dy="0">Приложения и фоновые обработчики используют отдельные сервисные учётные записи; внешние соединения проходят через адаптеры. Прямой доступ клиентов к хранилищам закрыт. Ключами и секретами управляет Vault.</tspan></text>
<rect x="40" y="1310" width="2110" height="60" rx="8" fill="#fff7e7" stroke="#d7b571" />
<text x="54" y="1334" font-family="Arial, sans-serif" font-size="14" fill="#172d43" text-anchor="start"><tspan x="54" dy="0">MVP размещается на виртуальных машинах. Клинические и платёжные функции развиваются на следующем этапе; медкарты и 1С пока остаются в защищённом старом контуре.</tspan></text>
</svg>