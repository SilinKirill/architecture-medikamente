<text x="54" y="794" font-family="Arial, sans-serif" font-size="14" fill="#172d43" text-anchor="start">
<tspan x="54" dy="0">До допуска: изолированный Landing/Quarantine. NiFi + классификатор + OpenMetadata; unknown блокируется. Аналитик только Gold, контроль малых групп/выгрузок. Подробности движка — Task6.</tspan>
<tspan x="54" dy="18.900000000000002">Риски: R02, R03, R07, R11, R12.</tspan>
