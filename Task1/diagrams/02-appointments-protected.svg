<tspan x="430" dy="17.55">напоминание</tspan>
</text>
<rect x="597.6" y="718.5" width="174.8" height="43.0" fill="white" rx="3"/>
<text x="685" y="735.2" font-family="Arial, sans-serif" font-size="13" fill="#172d43" text-anchor="middle">
<tspan x="685" dy="0">Минимальные сведения</tspan>
<tspan x="685" dy="17.55">и проверенный получатель</tspan>
</text>
<rect x="72.8" y="703.5" width="94.4" height="43.0" fill="white" rx="3"/>
<text x="120" y="720.2" font-family="Arial, sans-serif" font-size="13" fill="#172d43" text-anchor="middle">
<tspan x="120" dy="0">Напоминание</tspan>
<tspan x="120" dy="17.55">без диагноза</tspan>
</text>
<rect x="926.05" y="878.5" width="127.9" height="43.0" fill="white" rx="3"/>
<text x="990" y="895.2" font-family="Arial, sans-serif" font-size="13" fill="#172d43" text-anchor="middle">
<tspan x="990" dy="0">Напоминание врачу</tspan>
<tspan x="990" dy="17.55">его расписание</tspan>
</text>
<rect x="1482.75" y="713.5" width="114.5" height="43.0" fill="white" rx="3"/>
<text x="1540" y="730.2" font-family="Arial, sans-serif" font-size="13" fill="#172d43" text-anchor="middle">
<tspan x="1540" dy="0">Результат связи</tspan>
<tspan x="1540" dy="17.55">и аудит</tspan>
</text>
<rect x="40" y="1100" width="1560" height="65" rx="8" fill="#fff7e7" stroke="#d7b571"/>
<text x="54" y="1124" font-family="Arial, sans-serif" font-size="14" fill="#172d43" text-anchor="start">
<tspan x="54" dy="0">Контроль: чужой patient_id и занятый слот отклоняются; повтор запроса не создаёт дубль. Контакт не раскрывает диагноз; врач видит свои записи. Автоматические push/voice и подтверждение/отмена через приложение</tspan>
<tspan x="54" dy="18.900000000000002">— годовой этап.</tspan>
</text>
<rect x="40" y="1175" width="1560" height="45" rx="8" fill="#fff7e7" stroke="#d7b571"/>
<text x="54" y="1199" font-family="Arial, sans-serif" font-size="14" fill="#172d43" text-anchor="start">
<tspan x="54" dy="0">Легенда: P — операция; D — хранилище; прямоугольник — участник. Связь врача с расписанием проверяется на сервере. Риски: R01, R03, R05, R06.</tspan>
</text>
</svg>