<tspan x="40" dy="0">Запись и напоминания — защита потоков</tspan>
</text>
<text x="40" y="88" font-family="Arial, sans-serif" font-size="14" fill="#172d43" text-anchor="start">
<tspan x="40" dy="0">MVP: пациент записывается через портал; ресепшен вручную напоминает за сутки пациенту и специалисту.</tspan>
</text>
