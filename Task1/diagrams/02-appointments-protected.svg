<text x="990" y="550.2" font-family="Arial, sans-serif" font-size="13" fill="#172d43" text-anchor="middle">
<tspan x="990" dy="0">Нужный контакт</tspan>
<tspan x="990" dy="17.55">personal / PII</tspan>
</text>
<rect x="379.4" y="528.5" width="121.2" height="43.0" fill="white" rx="3"/>
