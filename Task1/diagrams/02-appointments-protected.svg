<tspan x="990" dy="0">Подтверждённая запись</tspan>
<tspan x="990" dy="17.55">medical / HEALTH</tspan>
</text>
<rect x="1082.65" y="418.5" width="154.70000000000002" height="43.0" fill="white" rx="3"/>
<text x="1160" y="435.2" font-family="Arial, sans-serif" font-size="13" fill="#172d43" text-anchor="middle">
<tspan x="1160" dy="0">Проверенный контакт</tspan>
<tspan x="1160" dy="17.55">через модуль Registry</tspan>
</text>
<rect x="921.0" y="367.25" width="148.0" height="25.5" fill="white" rx="3"/>
<text x="995" y="384.0" font-family="Arial, sans-serif" font-size="13" fill="#172d43" text-anchor="middle">
<tspan x="995" dy="0">Расписание на завтра</tspan>
</text>
