<rect x="40" y="770" width="1410" height="75" rx="8" fill="#fff7e7" stroke="#d7b571"/>
<text x="54" y="794" font-family="Arial, sans-serif" font-size="14" fill="#172d43" text-anchor="start">
<tspan x="54" dy="0">Платежи учитываются вручную в Excel и 1С. При обследовании проверить состав данных в файлах и базах, включая наличие карточных реквизитов. R03, R04, R05, R08.</tspan>
</text>
<rect x="40" y="855" width="1410" height="55" rx="8" fill="#fff7e7" stroke="#d7b571"/>
<text x="54" y="879" font-family="Arial, sans-serif" font-size="14" fill="#172d43" text-anchor="start">
<tspan x="54" dy="0">Легенда: прямоугольник — участник; скруглённый блок P — операция; две линии D — хранилище. PII — персональные; HEALTH — медицинские; HR — кадровые. Меры в подписи применяются к указанным</tspan>
<tspan x="54" dy="18.900000000000002">операциям и потокам.</tspan>
</text>
