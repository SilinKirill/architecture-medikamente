<rect width="100%" height="100%" fill="white"/>
<text x="40" y="53" font-family="Arial, sans-serif" font-size="25" fill="#172d43" text-anchor="start" font-weight="bold">
<tspan x="40" dy="0">Оплата — защищённые онлайн- и кассовые потоки</tspan>
</text>
<text x="40" y="88" font-family="Arial, sans-serif" font-size="14" fill="#172d43" text-anchor="start">
<tspan x="40" dy="0">Целевое состояние: источник статуса онлайн-оплаты — проверенный ответ эквайера. Редирект браузера и сообщение пациента не подтверждают платёж.</tspan>
</text>
<rect x="475" y="140" width="1130" height="980" rx="12" fill="none" stroke="#9aa9b8" stroke-dasharray="8 5"/>
<text x="490" y="167" font-family="Arial, sans-serif" font-size="14" fill="#172d43" text-anchor="start" font-weight="bold">
<tspan x="490" dy="0">Граница обработки клиники · Billing и адаптер учёта · PAN/CVV сюда не поступают</tspan>
</text>
