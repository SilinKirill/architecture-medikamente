<rect x="1920.9" y="1159.75" width="188.20000000000002" height="60.5" fill="white" rx="3" />
<text x="2015" y="1176.4" font-family="Arial, sans-serif" font-size="13" fill="#172d43" text-anchor="middle"><tspan x="2015" dy="0">Решение OPA, ключи,</tspan><tspan x="2015" dy="17.55">учётные записи и аудит</tspan><tspan x="2015" dy="17.55">TLS; отказ при неизвестном</tspan></text>
<rect x="45" y="1610" width="1540" height="65" rx="8" fill="#fff7e7" stroke="#d7b571" />
<text x="59" y="1634" font-family="Arial, sans-serif" font-size="14" fill="#172d43" text-anchor="start"><tspan x="59" dy="0">Сплошные связи: данные и метаданные. Пунктир: управление, политики и утверждение. Обработчики и сервис чтения используют отдельные роли, TLS, Vault и защищённый аудит.</tspan></text>
<rect x="45" y="1685" width="1540" height="75" rx="8" fill="#fff7e7" stroke="#d7b571" />
<text x="59" y="1709" font-family="Arial, sans-serif" font-size="14" fill="#172d43" text-anchor="start"><tspan x="59" dy="0">Сервис чтения проверяет текущую версию в реестре заданий и права при каждом запросе. Прямой доступ к хранилищам и старым версиям закрыт. Публиковать проверенные слои может только служба публикации.</tspan><tspan x="59" dy="18.900000000000002">Неопределённый класс запрещает публикацию.</tspan></text>
<rect x="45" y="1790" width="2140" height="65" rx="8" fill="#fff7e7" stroke="#d7b571" />
<text x="59" y="1814" font-family="Arial, sans-serif" font-size="14" fill="#172d43" text-anchor="start"><tspan x="59" dy="0">Масштабирование: отдельные пулы OCR, классификации и чтения; ограниченные партии, управление входным потоком и временные назначения заданий. Версия конвейера учитывает все компоненты обработки; повтор не создаёт дубли и не заменяет новую публикацию старой.</tspan></text>
</svg>