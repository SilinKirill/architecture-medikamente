<tspan x="40" dy="0">Диаграмма Исикавы — риски миграции «Медикаменте»</tspan>
</text>
<text x="40" y="88" font-family="Arial, sans-serif" font-size="14" fill="#172d43" text-anchor="start"><tspan x="40" dy="0">Потенциальные причины снижения производительности и устойчивости. Для B01–B18 в отчёте определены меры, приоритеты и проверки.</tspan></text>
