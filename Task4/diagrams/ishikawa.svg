<text x="2060.0" y="603.4" font-family="Arial, sans-serif" font-size="16" fill="#172d43" text-anchor="middle"><tspan x="2060.0" dy="0">Снижение скорости</tspan><tspan x="2060.0" dy="21.6">и устойчивости</tspan><tspan x="2060.0" dy="21.6">при миграции и росте ×5</tspan></text>
<rect x="165" y="160" width="350" height="70" rx="12" fill="#e8f0fb" stroke="#2361a6" stroke-width="2" />
<text x="340.0" y="200.0" font-family="Arial, sans-serif" font-size="16" fill="#172d43" text-anchor="middle">
<tspan x="340.0" dy="0">Инфраструктура</tspan>
</text>
<text x="242.5" y="284.2" font-family="Arial, sans-serif" font-size="16" fill="#172d43" text-anchor="middle">
<tspan x="242.5" dy="0">B01 Общий сервер —</tspan>
<tspan x="242.5" dy="21.6">единая точка отказа</tspan>
</text>
<text x="242.5" y="394.2" font-family="Arial, sans-serif" font-size="16" fill="#172d43" text-anchor="middle">
<tspan x="242.5" dy="0">B02 Насыщение дисков,</tspan>
<tspan x="242.5" dy="21.6">нехватка ёмкости</tspan>
</text>
<text x="242.5" y="504.2" font-family="Arial, sans-serif" font-size="16" fill="#172d43" text-anchor="middle">
<tspan x="242.5" dy="0">B03 Задержки и обрывы</tspan>
<tspan x="242.5" dy="21.6">каналов филиалов</tspan>
</text>
<rect x="755" y="160" width="350" height="70" rx="12" fill="#e8f0fb" stroke="#2361a6" stroke-width="2" />
<text x="930.0" y="200.0" font-family="Arial, sans-serif" font-size="16" fill="#172d43" text-anchor="middle">
<tspan x="930.0" dy="0">Данные</tspan>
</text>
<text x="832.5" y="284.2" font-family="Arial, sans-serif" font-size="16" fill="#172d43" text-anchor="middle">
<tspan x="832.5" dy="0">B04 Дубли пациентов,</tspan>
<tspan x="832.5" dy="21.6">ошибочная идентификация</tspan>
</text>
<text x="832.5" y="394.2" font-family="Arial, sans-serif" font-size="16" fill="#172d43" text-anchor="middle"><tspan x="832.5" dy="0">B05 Изменения схем Excel,</tspan><tspan x="832.5" dy="21.6">ошибки распознавания</tspan></text>
<text x="832.5" y="504.2" font-family="Arial, sans-serif" font-size="16" fill="#172d43" text-anchor="middle">
<tspan x="832.5" dy="0">B06 Два источника записи,</tspan>
<tspan x="832.5" dy="21.6">расхождения данных</tspan>
</text>
<rect x="1345" y="160" width="350" height="70" rx="12" fill="#e8f0fb" stroke="#2361a6" stroke-width="2" />
<text x="1520.0" y="200.0" font-family="Arial, sans-serif" font-size="16" fill="#172d43" text-anchor="middle">
<tspan x="1520.0" dy="0">Интеграции и ПО</tspan>
</text>
<text x="1422.5" y="284.2" font-family="Arial, sans-serif" font-size="16" fill="#172d43" text-anchor="middle">
<tspan x="1422.5" dy="0">B07 Блокировки файловой 1С,</tspan>
<tspan x="1422.5" dy="21.6">зависимость от OLE</tspan>
</text>
<text x="1422.5" y="394.2" font-family="Arial, sans-serif" font-size="16" fill="#172d43" text-anchor="middle">
<tspan x="1422.5" dy="0">B08 Таймауты партнёров,</tspan>
<tspan x="1422.5" dy="21.6">повторные операции</tspan>
</text>
<text x="1422.5" y="504.2" font-family="Arial, sans-serif" font-size="16" fill="#172d43" text-anchor="middle">
<tspan x="1422.5" dy="0">B09 Тяжёлые SQL и выгрузки,</tspan>
<tspan x="1422.5" dy="21.6">конкуренция с приёмом</tspan>
</text>
<rect x="165" y="1040" width="350" height="70" rx="12" fill="#e8f0fb" stroke="#2361a6" stroke-width="2" />
<text x="340.0" y="1080.0" font-family="Arial, sans-serif" font-size="16" fill="#172d43" text-anchor="middle">
<tspan x="340.0" dy="0">Персонал</tspan>
</text>
<text x="242.5" y="914.2" font-family="Arial, sans-serif" font-size="16" fill="#172d43" text-anchor="middle"><tspan x="242.5" dy="0">B10 Недостаток ресурсов IT</tspan><tspan x="242.5" dy="21.6">для проекта и сопровождения</tspan></text>
<text x="242.5" y="804.2" font-family="Arial, sans-serif" font-size="16" fill="#172d43" text-anchor="middle">
<tspan x="242.5" dy="0">B11 Ошибки ручного ввода,</tspan>
<tspan x="242.5" dy="21.6">непривычные процессы</tspan>
</text>
<text x="242.5" y="694.2" font-family="Arial, sans-serif" font-size="16" fill="#172d43" text-anchor="middle"><tspan x="242.5" dy="0">B12 Неопределённая</tspan><tspan x="242.5" dy="21.6">ответственность за данные</tspan></text>
<rect x="755" y="1040" width="350" height="70" rx="12" fill="#e8f0fb" stroke="#2361a6" stroke-width="2" />
<text x="930.0" y="1080.0" font-family="Arial, sans-serif" font-size="16" fill="#172d43" text-anchor="middle">
<tspan x="930.0" dy="0">Процессы</tspan>
</text>
<text x="832.5" y="914.2" font-family="Arial, sans-serif" font-size="16" fill="#172d43" text-anchor="middle"><tspan x="832.5" dy="0">B13 Недостаток замеров</tspan><tspan x="832.5" dy="21.6">для оценки нагрузки</tspan></text>
<text x="832.5" y="804.2" font-family="Arial, sans-serif" font-size="16" fill="#172d43" text-anchor="middle"><tspan x="832.5" dy="0">B14 Непроверенное</tspan><tspan x="832.5" dy="21.6">переключение и откат</tspan></text>
<text x="832.5" y="694.2" font-family="Arial, sans-serif" font-size="16" fill="#172d43" text-anchor="middle">
<tspan x="832.5" dy="0">B15 Очередь ручной</tspan>
<tspan x="832.5" dy="21.6">проверки классификации</tspan>
</text>
<rect x="1345" y="1040" width="350" height="70" rx="12" fill="#e8f0fb" stroke="#2361a6" stroke-width="2" />
<text x="1520.0" y="1080.0" font-family="Arial, sans-serif" font-size="16" fill="#172d43" text-anchor="middle">
<tspan x="1520.0" dy="0">Защита и наблюдаемость</tspan>
</text>
<text x="1422.5" y="914.2" font-family="Arial, sans-serif" font-size="16" fill="#172d43" text-anchor="middle">
<tspan x="1422.5" dy="0">B16 Нагрузка шифрования,</tspan>
<tspan x="1422.5" dy="21.6">KMS и записи аудита</tspan>
</text>
<text x="1422.5" y="804.2" font-family="Arial, sans-serif" font-size="16" fill="#172d43" text-anchor="middle">
<tspan x="1422.5" dy="0">B17 Обход прав в импорте,</tspan>
<tspan x="1422.5" dy="21.6">лишние выгрузки</tspan>
</text>
<text x="1422.5" y="694.2" font-family="Arial, sans-serif" font-size="16" fill="#172d43" text-anchor="middle"><tspan x="1422.5" dy="0">B18 Недостаточный мониторинг</tspan><tspan x="1422.5" dy="21.6">и непроверенное восстановление</tspan></text>
<rect x="45" y="1160" width="2130" height="55" rx="8" fill="#fff7e7" stroke="#d7b571" />
<text x="59" y="1184" font-family="Arial, sans-serif" font-size="14" fill="#172d43" text-anchor="start"><tspan x="59" dy="0">Исходная система: общий сервер, файловые 1С и ручные операции; IT-команда — три человека. Резервирование, пределы нагрузки, качество данных и готовность процедур проверяются при обследовании.</tspan></text>
<rect x="45" y="1225" width="2130" height="50" rx="8" fill="#fff7e7" stroke="#d7b571" />
<text x="59" y="1249" font-family="Arial, sans-serif" font-size="14" fill="#172d43" text-anchor="start"><tspan x="59" dy="0">Порядок: владельцы данных и исходные замеры → восстановление и права доступа → пробный перенос и испытания при росте ×5 → репетиция переключения и отката → решение по критериям готовности.</tspan></text>
</svg>